[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epsysex"
version = "0.1.0"
description = "EP SysEx protocol and project format: JSON compiler, TAR dialect, FILE client, and hardware test tools"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["teenage-engineering", "ep-133", "ep-40", "ko-ii", "sysex", "midi", "reverse-engineering"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

# The core library (compile / parse / diff) is stdlib-only. Device I/O
# (fileclient, identity-over-MIDI) additionally needs mido + a backend.
[project.optional-dependencies]
device = ["mido", "python-rtmidi"]
hil = ["mido", "python-rtmidi", "numpy", "sounddevice"]

[tool.setuptools]
packages = ["epsysex"]
